<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Elements</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* launch page: reuses the game's colours and fonts so light/dark mode match */
  body { min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .home { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
  .home h1 { margin: 0; font-size: 2.6em; font-weight: normal; letter-spacing: .02em; }
  .home .sub { margin: -16px 0 0; color: var(--muted); font-size: 0.95em; }
  a.play {
    font: inherit; color: var(--fg); background: var(--bg); text-decoration: none;
    border: 1px solid var(--line); padding: 8px 0; width: 9em; text-align: center; cursor: pointer;
    transition: box-shadow .2s ease, background .2s ease;
  }
  a.play:hover { background: var(--hover); text-decoration: underline; box-shadow: 0 0 14px -3px var(--fg); }
  a.play:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  a.play:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="home">
    <h1>Four Elements</h1>
    <p class="sub">the elements stir.</p>
    <a class="play" id="play" href="game.html">play.</a>
  </main>
</body>
</html>
