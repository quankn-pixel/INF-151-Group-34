<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Elements</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="drops" id="drops" aria-hidden="true"></div>

<div class="wrap">
  <div class="log" id="log" aria-live="polite"></div>

  <div class="actions">
    <h1>the elements stir.</h1>
    <div class="mult" id="mult" hidden>×1.0</div>
    <div class="stack" id="gather"></div>
  </div>

  <div class="side">
    <div class="box">
      <span class="label">stores</span>
      <div class="empty" id="empty">nothing yet.</div>
      <div id="store-rows"></div>
    </div>

    <div class="box upgrades" id="upgrades-box" hidden>
      <span class="label">upgrades</span>
      <div class="up" id="up-res" hidden>
        <div class="up-head"><button class="el upbtn" id="btn-res" type="button"></button><span class="up-note" id="res-power"></span></div>
        <div class="up-sub" id="res-cost"></div>
      </div>
      <div class="up" id="up-struct" hidden>
        <div class="up-head"><button class="el upbtn" id="btn-struct" type="button"></button><span class="up-note" id="struct-info"></span></div>
        <div class="up-sub" id="struct-cost"></div>
      </div>
      <div class="up" id="up-cond" hidden>
        <div class="up-head"><button class="el upbtn" id="btn-cond" type="button"></button></div>
        <div class="up-sub" id="cond-note"></div>
      </div>
    </div>
  </div>
</div>

<div class="tray box" id="balance-box" hidden>
  <span class="label">balance</span>
  <div class="total">total stored <span id="total">0</span><span class="cap" id="cap"></span></div>
  <div class="bar" id="bar" role="img" aria-label="Share of each element"></div>
  <div class="ticks" aria-hidden="true"><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i></div>
  <div class="legend" id="legend"></div>
</div>

<div class="footer">
  <span class="size">text size
    <button class="link" id="size-down" type="button" aria-label="Smaller text">&minus;</button>
    <button class="link" id="size-up" type="button" aria-label="Larger text">+</button>
  </span>
  <span id="save-status">not saved yet.</span>
  <span id="restart-wrap"><button class="link" id="restart-btn" type="button">restart.</button></span>
  <span class="confirm" id="restart-confirm" hidden>
    <span>lose everything?</span>
    <button class="link" id="restart-yes" type="button">yes.</button>
    <button class="link" id="restart-no" type="button">no.</button>
  </span>
</div>

<!-- Plain scripts (no modules) so the game opens straight from the file system. Order matters. -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/log.js"></script>
<script src="js/effects.js"></script>
<script src="js/ui.js"></script>
<script src="js/controls.js"></script>
<script src="js/game.js"></script>
</body>
</html>
