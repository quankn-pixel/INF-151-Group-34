<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Elements</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="pages">

  <!-- ===== layer 2: above layer 1 ===== -->
  <section class="page" id="page2" aria-label="layer 2" aria-hidden="true">
    <canvas id="space" aria-hidden="true"></canvas>
    <header class="l2-head">
      <span class="l2-title">layer 2 &middot; the stars</span>
      <div class="dust" id="dust" title="condensed stardust">
        <i class="orb" aria-hidden="true"></i>
        <span class="dust-n" id="dust-n">0</span>
        <span class="dust-l">stardust</span>
      </div>
      <span class="l2-sub" id="dust-sub"></span>
    </header>
    <div class="l2-body">
      <div class="skill-cell">
        <div class="skill" id="skill" role="button" tabindex="0" aria-expanded="false" aria-label="skill tree: click to open">
          <svg id="skill-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          <div class="skill-hint" id="skill-hint">skill tree</div>
          <div class="skill-info" id="skill-info">
            <div class="si-name" id="si-name"></div>
            <div class="si-desc" id="si-desc"></div>
            <div class="si-row"><span class="si-cost" id="si-cost"></span><button class="el" id="si-buy" type="button">condense</button></div>
          </div>
        </div>
      </div>
      <div class="event" id="event">
        <h2 id="mg-title"></h2>
        <p class="mg-blurb" id="mg-blurb"></p>
        <div class="mg-stage"><canvas id="mg" width="480" height="320"></canvas></div>
        <div class="mg-row">
          <button class="el" id="mg-start" type="button">begin</button>
          <span class="mg-status" id="mg-status"></span>
        </div>
        <p class="mg-result" id="mg-result" aria-live="polite"></p>
      </div>
    </div>
    <button class="nav down" id="nav-down" type="button">&#9660; layer 1</button>
  </section>

  <!-- ===== layer 1 ===== -->
  <section class="page" id="page1" aria-label="layer 1">
    <header class="l1-top">
      <h1 class="game-title">Four Elements</h1>
      <p class="goal" id="goal" aria-live="polite"></p>
      <div class="buffs" id="buffs"></div>
    </header>

    <div class="l1-main">
      <div class="stage" id="stage">
        <div class="core-wrap">
          <canvas id="core" aria-hidden="true"></canvas>
          <button id="core-btn" type="button" aria-label="gather"></button>
        </div>
        <div class="cond" id="cond">
          <div class="cond-info" id="cond-info"></div>
          <div class="cond-bar" aria-hidden="true"><i id="cond-fill"></i></div>
          <div class="cond-btns">
            <button class="el wide" id="btn-condense" type="button"></button>
            <button class="el wide collapse" id="btn-collapse" type="button" hidden></button>
          </div>
        </div>
        <div class="choose" id="choose" hidden>
          <h2>Choose an element:</h2>
          <div class="stack" id="choose-btns"></div>
        </div>
      </div>

      <aside class="box upgrades" id="upgrades">
        <span class="label">builds</span>
        <div class="cards scroll" id="cards"></div>
      </aside>
    </div>

    <aside class="box store" id="store">
      <span class="label">stores</span>
      <div class="s-main"><span class="s-ico" id="s-ico"></span><span class="s-name" id="s-name"></span><span class="s-n" id="s-n">0</span></div>
      <div class="s-line"><span id="s-rate"></span></div>
      <div class="s-line"><span id="s-click"></span></div>
      <div class="s-line"><span id="s-star"></span></div>
    </aside>

    <button class="nav up" id="nav-up" type="button" hidden>&#9650; layer 2</button>
  </section>
</div>

<div class="footer" id="footer">
  <span style="margin-right:auto"><button class="link" id="back-btn" type="button">&larr; back.</button></span>
  <span class="size">text size
    <button class="link" id="size-down" type="button" aria-label="Smaller text">&minus;</button>
    <button class="link" id="size-up" type="button" aria-label="Larger text">+</button>
  </span>
  <span id="save-status">not saved yet.</span>
  <span id="restart-wrap"><button class="link" id="restart-btn" type="button">restart.</button></span>
  <span class="confirm" id="restart-confirm" hidden>
    <span>lose everything?</span>
    <button class="link" id="restart-yes" type="button">yes.</button>
    <button class="link" id="restart-no" type="button">no.</button>
  </span>
</div>

<canvas id="nova" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- Plain scripts (no modules) so the game opens straight from the file system. Order matters. -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/effects.js"></script>
<script src="js/skills.js"></script>
<script src="js/minigames.js"></script>
<script src="js/ui.js"></script>
<script src="js/controls.js"></script>
<script src="js/game.js"></script>
</body>
</html>
